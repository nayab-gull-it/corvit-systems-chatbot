  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#aiBg)" />

  <!-- Neural Network Mesh Nodes -->
  <g opacity="0.2" stroke="#8b5cf6" stroke-width="1.5">
    <line x1="600" y1="80" x2="680" y2="130" />
    <line x1="680" y1="130" x2="630" y2="200" />
    <line x1="630" y1="200" x2="730" y2="190" />
    <line x1="730" y1="190" x2="700" y2="280" />
    <line x1="630" y1="200" x2="650" y2="310" />
    <circle cx="600" cy="80" r="5" fill="#8b5cf6" />
    <circle cx="680" cy="130" r="7" fill="#ec4899" />
    <circle cx="630" cy="200" r="8" fill="#3b82f6" />
    <circle cx="730" cy="190" r="6" fill="#10b981" />
    <circle cx="700" cy="280" r="7" fill="#8b5cf6" />
    <circle cx="650" cy="310" r="5" fill="#ec4899" />
