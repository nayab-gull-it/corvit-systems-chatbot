  <circle cx="66" cy="61" r="5" fill="#a855f7" />
  <text x="82" y="66" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CORVIT SYSTEMS RWP</text>

  <rect x="280" y="45" width="210" height="32" rx="16" fill="url(#aiGradient)" />
  <text x="385" y="66" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FLAGSHIP 2026 TRACK</text>

  <!-- Title -->
  <text x="50" y="130" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">Agentic AI &amp;</text>
  <text x="50" y="175" fill="url(#aiGradient)" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900">Autonomous LLMs</text>

