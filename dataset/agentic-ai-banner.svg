    <text x="18" y="32" fill="#c084fc" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Autonomous Agents</text>
    <text x="18" y="55" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">CrewAI • AutoGen • LangGraph</text>
    <text x="18" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Tool Execution &amp; Planning</text>

    <!-- Box 2 -->
    <rect x="230" y="0" width="210" height="85" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="248" y="32" fill="#f472b6" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Vector Databases &amp; RAG</text>
    <text x="248" y="55" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Pinecone • ChromaDB • Qdrant</text>
    <text x="248" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Grounded Enterprise Search</text>

    <!-- Box 3 -->
    <rect x="460" y="0" width="230" height="85" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="478" y="32" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Weekend Fast Track</text>
    <text x="478" y="55" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Saturdays &amp; Sundays @ 4 PM</text>
    <text x="478" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Live Hands-on Projects</text>
  </g>

