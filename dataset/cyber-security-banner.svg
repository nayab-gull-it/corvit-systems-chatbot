<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b18" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="cyberAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cb2026" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <radialGradient id="cyberGlowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cb2026" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#cb2026" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyberGlowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#cyberBg)" />
  
  <!-- Circuit grid pattern -->
  <g opacity="0.12" stroke="#06b6d4" stroke-width="1.5" fill="none">
    <path d="M 0 50 H 800 M 0 100 H 800 M 0 150 H 800 M 0 200 H 800 M 0 250 H 800 M 0 300 H 800 M 0 350 H 800 M 0 400 H 800" />
    <path d="M 50 0 V 450 M 150 0 V 450 M 250 0 V 450 M 350 0 V 450 M 450 0 V 450 M 550 0 V 450 M 650 0 V 450 M 750 0 V 450" />
    <circle cx="250" cy="150" r="6" fill="#06b6d4" />
    <circle cx="550" cy="250" r="6" fill="#06b6d4" />
    <circle cx="350" cy="350" r="6" fill="#06b6d4" />
  </g>

  <!-- Glow orb -->
  <circle cx="680" cy="120" r="160" fill="url(#cyberGlowRed)" />
  <circle cx="120" cy="360" r="150" fill="url(#cyberGlowCyan)" />

  <!-- Top Badge -->
  <rect x="50" y="45" width="220" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" />
  <circle cx="66" cy="61" r="5" fill="#ef4444" />
  <text x="82" y="66" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CORVIT SYSTEMS RWP</text>

  <!-- Tag Pill -->
  <rect x="280" y="45" width="190" height="32" rx="16" fill="url(#cyberAccent)" />
  <text x="375" y="66" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DEFENSIVE &amp; OFFENSIVE</text>

  <!-- Title -->
  <text x="50" y="130" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">Cyber Security &amp;</text>
  <text x="50" y="175" fill="url(#cyberAccent)" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900">Ethical Hacking (CEH)</text>

  <!-- Subtitle -->
  <text x="50" y="215" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">EC-Council Accredited • Fortinet &amp; Palo Alto Firewalls • SOC Analyst</text>

  <!-- Features Grid Box -->
  <g transform="translate(50, 245)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="210" height="85" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="18" y="32" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Penetration Testing</text>
    <text x="18" y="55" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Kali Linux • Metasploit</text>
    <text x="18" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Web App Exploitation</text>

    <!-- Box 2 -->
    <rect x="230" y="0" width="210" height="85" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="248" y="32" fill="#f87171" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Next-Gen Firewalls</text>
    <text x="248" y="55" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Fortinet NSE-4</text>
    <text x="248" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Palo Alto PAN-OS Dual Track</text>

    <!-- Box 3 -->
    <rect x="460" y="0" width="230" height="85" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="478" y="32" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">SOC &amp; Defensive Ops</text>
    <text x="478" y="55" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">SIEM • Incident Response</text>
    <text x="478" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Live Attack Simulations</text>
  </g>

  <!-- Footer Info Bar -->
  <rect x="50" y="360" width="700" height="50" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="70" y="390" fill="#f1f5f9" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📍 Zarwar Center, 6th Road, Rawalpindi</text>
  <text x="430" y="390" fill="#f1f5f9" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📞 (051) 4928004 • 💬 0311-1444473</text>

  <!-- Graphic Shield Emblem on Right -->
  <g transform="translate(640, 110)">
    <polygon points="50,0 100,20 100,80 50,110 0,80 0,20" fill="url(#cyberNeon)" opacity="0.2" />
    <polygon points="50,10 90,26 90,75 50,100 10,75 10,26" stroke="#06b6d4" stroke-width="2.5" fill="none" />
    <!-- Lock shape -->
    <rect x="36" y="50" width="28" height="24" rx="4" fill="#ffffff" />
    <path d="M 42 50 V 42 A 8 8 0 0 1 58 42 V 50" fill="none" stroke="#ffffff" stroke-width="3" />
  </g>
</svg>
