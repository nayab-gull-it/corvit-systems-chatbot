<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#071b2d" />
    </linearGradient>
    <linearGradient id="cloudAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="devopsBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#cloudBg)" />

  <!-- Infinity loop decorative graphic for DevOps -->
  <path d="M 620 180 C 580 140, 530 140, 490 180 C 450 220, 400 220, 360 180" fill="none" stroke="#2563eb" stroke-width="3" opacity="0.15" />
  <circle cx="680" cy="140" r="140" fill="#ff9900" opacity="0.12" filter="blur(45px)" />
  <circle cx="150" cy="380" r="120" fill="#2563eb" opacity="0.12" filter="blur(40px)" />

  <!-- Top Badges -->
  <rect x="50" y="45" width="220" height="32" rx="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.2" />
  <circle cx="66" cy="61" r="5" fill="#f59e0b" />
  <text x="82" y="66" fill="#e2e8f0" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CORVIT SYSTEMS RWP</text>

  <rect x="280" y="45" width="220" height="32" rx="16" fill="url(#cloudAccent)" />
  <text x="390" y="66" fill="#000000" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">FREE AWS CLOUD BUNDLE</text>

  <!-- Title -->
  <text x="50" y="130" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">DevOps Engineering &amp;</text>
  <text x="50" y="175" fill="url(#cloudAccent)" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900">AWS Cloud Architect</text>

  <!-- Subtitle -->
  <text x="50" y="215" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Docker &bull; Kubernetes &bull; Jenkins CI/CD &bull; Terraform IaC &bull; AWS EC2, S3, VPC</text>

  <!-- Features Grid Box -->
  <g transform="translate(50, 245)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="210" height="85" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="18" y="32" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Containers &amp; K8s</text>
    <text x="18" y="55" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Docker Engine &bull; Compose</text>
    <text x="18" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Kubernetes Cluster Pods</text>

    <!-- Box 2 -->
    <rect x="230" y="0" width="210" height="85" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="248" y="32" fill="#fbbf24" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">CI/CD &amp; Automation</text>
    <text x="248" y="55" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Jenkins &bull; GitHub Actions</text>
    <text x="248" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Terraform Infrastructure</text>

    <!-- Box 3 -->
    <rect x="460" y="0" width="230" height="85" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="478" y="32" fill="#34d399" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">AWS Cloud Module</text>
    <text x="478" y="55" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Free with DevOps Course</text>
    <text x="478" y="70" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Hands-on Cloud Labs</text>
  </g>

  <!-- Footer Info Bar -->
  <rect x="50" y="360" width="700" height="50" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="70" y="390" fill="#f1f5f9" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📍 Zarwar Center, 6th Road Stop, Rawalpindi</text>
  <text x="440" y="390" fill="#f1f5f9" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">📞 (051) 4928004 &bull; 💬 0311-1444473</text>
</svg>
